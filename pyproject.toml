# https://morethanmonkeys.medium.com/adding-ruff-to-your-python-project-with-github-actions-5a1017714c45
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # E: pycodestyle, F: pyflakes, I: isort (import sorting)
ignore = ["E501"]         # Ignore line length errors (optional, e.g. if Black handles this)